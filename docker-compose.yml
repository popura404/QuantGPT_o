services:
  quantgpt:
    build: .
    ports:
      - "8003:8003"
    volumes:
      - quantgpt-data:/app/data
      - quantgpt-reports:/app/reports
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/quantgpt.db}
    restart: unless-stopped

volumes:
  quantgpt-data:
  quantgpt-reports:
